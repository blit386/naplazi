# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for naplazi ("Beach Detector"), a BLIT386 game and the engine's test bed.
#
# Review exclusions (path_filters): copies and generated output that add noise without unique review signal.
#
# - `.blit/**` is the pristine kit copy `npx blit agents sync` diffs against to detect local edits; never hand-edited.
# - `.claude/{hooks,rules}/**`, `.cursor/{commands,hooks,rules}/**`, and the top-level `docs/*.md` are kit-owned
#   (listed in `.blit/manifest.json`) and overwritten by `npx blit agents sync`. Fixes belong upstream in
#   `blit386/packages/kit/content/`, where they are already reviewed. `docs/*.md` does not match `docs/design/**`,
#   which is ours.
# - `public/**` is binary: `public/sprites/*.png` is generated by `pnpm run sprites` (`tools/make-sprites.mjs`), plus
#   the favicon.
# - `pnpm-lock.yaml` is the generated lock file.
#
# `.claude/skills/**` cannot be split by a filter (one skill in it is ours), so it is handled by a path instruction.
#
# Auto review is disabled by default. To enable it, add the `cr` label to the PR.
reviews:
  review_status: false
  path_filters:
    - '!.blit/**'
    - '!.claude/hooks/**'
    - '!.claude/rules/**'
    - '!.cursor/commands/**'
    - '!.cursor/hooks/**'
    - '!.cursor/rules/**'
    - '!docs/*.md'
    - '!public/**'
    - '!pnpm-lock.yaml'
  path_instructions:
    - path: '**'
      instructions: >-
        American English spelling; no emoji anywhere. Plain hyphen-minus (-) for parenthetical breaks and ranges in
        prose and comments - never the en dash or em dash. Keep commands as `pnpm run <script>` (not bare `pnpm
        <script>`) and the kit helper as `npx blit ...` (it is not on the system PATH).
    - path: 'src/**/*.ts'
      instructions: >-
        Game code on the BLIT386 engine. Use the `BT` namespace for engine calls, never internal classes. Positions and
        sizes are whole numbers via `Vector2i` / `Rect2i`; floor any float before it reaches the engine. Colors are
        palette slots: slot 0 is transparent, 1-27 are the world ramp the day and night fade touches, 28-33 the fixed
        HUD colors (`src/palette/palette.ts`). Randomness goes through `BT.random` (seedable via `?seed=N`), never
        `Math.random()`. `update()` decides and `render()` only draws - flag logic in `render()` or drawing in
        `update()`. Drive timing from `BT.deltaSeconds`, not by counting frames. Anything reachable from `update()` that
        can throw (storage, vibration, other device APIs) must be guarded: there is no outer catch, and an uncaught
        throw stops the game loop for good. Avoid allocating in per-frame paths; mutating per-frame state in place is
        intended. Strict TypeScript: no `any`, `import type` for type-only imports, no `!` assertions. Comments are
        short JSDoc on declarations, only for what the code does not already say - flag comments that narrate code, cite
        task numbers or design docs, or have gone stale. `src/game.ts` stays thin: it wires systems together and is the
        only place two systems meet; flag a system that holds or calls another system instance (importing shared
        constants and types is fine). When a change alters how the game plays, check that `docs/design/game.md` still
        matches. Canonical detail: `CLAUDE.md` "Your notes".
    - path: 'src/{palette/palette.ts,sprites.ts}'
      instructions: >-
        `tools/make-sprites.mjs` imports these two files directly through Node type stripping. They may import only
        `blit386` (no relative imports) and must stay erasable TypeScript: no enums, no parameter properties, no
        namespaces.
    - path: 'src/playtest.ts'
      instructions: >-
        Dev-only `window.__game` hook for `pnpm run play`. It must stay gated to dev builds so it never ships in a
        release build. The snapshot itself lives in `Game.playtestState()` in `src/game.ts`.
    - path: 'tools/**'
      instructions: >-
        Offline sprite generator (`pnpm run sprites`), not runtime code. It reads geometry from `src/sprites.ts` and
        colors from `src/palette/palette.ts` so there is no second copy of either; flag any duplicated size or color.
        Regenerated PNGs decode to the same pixels but may differ byte-for-byte across Node/zlib versions - that is not
        a bug. Keep `tools/make-sprites.md` accurate when the script changes.
    - path: 'scripts/**'
      instructions: >-
        Agent and editor tooling: `play.mjs` drives the local Chrome or Edge through playwright-core for play-testing (a
        stand-in until the kit ships `blit play`), `format-file.sh` formats one file after an agent edit and must never
        fail that edit, `prettier-plugin-compact-tables.mjs` is shared with the blit386 monorepo - fix it there first.
    - path: '.claude/skills/**'
      instructions: >-
        Every skill here except `test-the-game/` is a kit-owned copy overwritten by `npx blit agents sync`; do not
        review those, fixes belong upstream in `blit386/packages/kit/content/skills/`. `test-the-game/` is hand-written
        for this game: keep it accurate to `scripts/play.mjs` and `window.__game`.
    - path: '{AGENTS.md,CLAUDE.md}'
      instructions: >-
        Shared with the kit: everything above "Your notes" is kit content refreshed by `npx blit agents sync` - do not
        suggest edits there. "Your notes" is ours: check it stays accurate against `src/`, `package.json` scripts, and
        `vite.config.js`.
    - path: 'docs/design/**'
      instructions: >-
        `game.md` describes the game as it plays today and must match `src/`; `roadmap.md` holds the lane-based redesign
        that is not built yet, in build order. Flag anything in `game.md` that describes behavior not built yet, or
        anything in `roadmap.md` that has since shipped.
    - path: '{vite.config.js,knip.json,package.json}'
      instructions: >-
        `vite.config.js` aliases `blit386` to the sibling monorepo's `src/` when `../../blit386/packages/blit386` exists
        (or `BLIT386_ENGINE_DIR` points elsewhere) and falls back to the npm package otherwise, as in CI;
        `BLIT386_ENGINE=npm` forces npm. Both paths must keep working. `knip.json` `ignore` lists files written but not
        wired in yet; an entry should be removed in the same change that wires its file into `src/game.ts`. Verify
        config changes against `pnpm run preflight`.
    - path: '.github/workflows/**'
      instructions: >-
        CI runs `pnpm run preflight` against the npm `blit386` package (no sibling monorepo checkout). Actions are
        pinned to a full commit SHA with the tag as a trailing comment; keep them pinned and permissions minimal.
  auto_review:
    enabled: false
    labels: ['cr']
